name: Build NEXORA APK
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: nexora
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        working-directory: .
        run: unzip -q nexora.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create . --platforms=android --project-name nexora --org com.nexora
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze (report only)
        run: flutter analyze
        continue-on-error: true
      - name: Unit tests (report only)
        run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-apk
          path: nexora/build/app/outputs/flutter-apk/app-release.apk
